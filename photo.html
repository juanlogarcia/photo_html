  .nav-bar {
    margin-bottom: 20px;

  .btn-home {
    display: inline-block;
    color: #aaa;

    padding: 6px 12px;
    border: 1px solid #444;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .btn-home:hover {
    color: #fff;
    background: #222;
    border-color: #666;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  
  .gallery img {
    width: 100%;       
    aspect-ratio: 1 / 1; 
    object-fit: cover; 
    border-radius: 6px;
    cursor: zoom-in;
    transition: transform 0.2s;
    display: block;
  }
  
  .gallery img:hover {
    transform: scale(1.03);
  }

  
  .lightbox {
    display: none;
    position: fixed;
    z-index: 999;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.95); 
    align-items: center;
    justify-content: center;
  }
  
  .lightbox:target {
    display: flex; 
  }
  
  .lightbox img {
    max-width: 92%;
    max-height: 85%;
    object-fit: contain; 
    border-radius: 4px;
    z-index: 1001;
  }
  
  .close-overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    cursor: zoom-out;
    z-index: 1000;
  }

  .close-btn {
    position: absolute;
    top: 20px;
    right: 25px;
    color: #fff;
    font-size: 38px;
    text-decoration: none;
    z-index: 1002;
    line-height: 1;
    opacity: 0.7;
  }
</style>
